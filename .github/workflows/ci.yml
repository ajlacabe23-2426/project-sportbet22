name: Probability lab checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/probability-lab-foundation
      - research/frozen-holdout-evaluation-20261024

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: End-to-end sample forecast
        env:
          PYTHONPATH: src
        run: python -m sportprob.cli forecast --data data/demo_games.csv --player DEMO-001 --stat points --as-of 2025-11-21
      - name: Check retrospective player context on synthetic records
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.cli history
          --data data/demo_games.csv
          --manifest data/demo_games.manifest.json
          --player DEMO-001 --stat points --as-of 2025-11-21
          --history-games 20
      - name: End-to-end backtest
        env:
          PYTHONPATH: src
        run: python -m sportprob.cli backtest --data data/demo_games.csv --player DEMO-001 --stat points
      - name: Verify offline HTML report CLI
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.cli report
          --data data/demo_games.csv
          --manifest data/demo_games.manifest.json
          --player DEMO-001 --stat points --as-of 2025-11-21
          --output outputs/ci-report.html
      - name: Assert report was produced
        run: test -s outputs/ci-report.html
      - name: Frozen holdout from checksum-verified synthetic fixture
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.cli holdout
          --data data/demo_games.csv
          --manifest data/demo_games.manifest.json
          --player DEMO-001 --stat points --start 2025-11-16

      - name: Compare frozen-holdout statistical distributions
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.cli compare
          --data data/demo_games.csv
          --manifest data/demo_games.manifest.json
          --player DEMO-001 --stat points --start 2025-11-16

      - name: Validate local research-data readiness with checksum-confirmed synthetic fixture
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.research_check
          --data data/demo_games.csv
          --manifest data/demo_games.manifest.json
          --player DEMO-001
          --train-end 2025-11-11
          --holdout-start 2025-11-16
      - name: Normalize an authorized synthetic fixture into ignored local dataset storage
        env:
          PYTHONPATH: src
        run: >-
          python -m sportprob.prepare
          --input data/demo_games.csv
          --data-out data/processed/ci-demo-normalized.csv
          --manifest-out data/processed/ci-demo-normalized.manifest.json
          --dataset-id ci-synthetic-test
          --source-name "SportProb authored synthetic fixture"
          --source-reference "local://synthetic-demo"
          --rights-evidence "SportProb original synthetic test data generated for validation"
          --confirm-authorized --synthetic

      - name: Verify synthetic retrospective two-season conversion and date-safe partition CLI
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover -s tests -p test_history_bridge.py -v

  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline mobile application and CSV parser checks
        run: node --test tests/mobile-ui.test.cjs tests/history-report-ui.test.cjs tests/player-comparison.test.cjs tests/manual-report-ui.test.cjs tests/instant-research.test.cjs
      - name: Test actual offline CSV/audit import in headless Chromium
        env:
          RUN_BROWSER_ACCEPTANCE: "1"
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          command -v "$CHROME_BIN"
          node --test tests/mobile-browser.test.cjs
